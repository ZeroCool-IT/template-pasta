name: Release

# Si avvia pubblicando un tag di versione, es.:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build e pacchetti
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Crea la release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TemplateMessaggi-win64.zip \
            --title "Template Messaggi $GITHUB_REF_NAME" --generate-notes

      - name: Pubblica l'aggiornamento automatico (ramo updates)
        run: |
          cd dist/updates
          git init -q -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json resources.neu
          git commit -qm "Aggiornamento $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" updates
