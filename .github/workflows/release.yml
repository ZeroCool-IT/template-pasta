name: Release

# Si avvia quando su main cambia neutralino.config.json (o a mano da Actions).
# Se la release per la "version" del config esiste già non fa nulla: per pubblicare
# basta alzare la versione e fare push.
on:
  push:
    branches: [main]
    paths: [neutralino.config.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versione da pubblicare
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version neutralino.config.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSION esiste già: niente da fare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.ver.outputs.skip != 'true'

      - name: Build e pacchetti
        if: steps.ver.outputs.skip != 'true'
        run: scripts/package.sh

      - name: Crea la release su GitHub
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" dist/TemplateMessaggi-win64.zip \
            --target "$GITHUB_SHA" --title "Template Messaggi $TAG" --generate-notes

      - name: Pubblica l'aggiornamento automatico (ramo updates)
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cd dist/updates
          git init -q -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json resources.neu
          git commit -qm "Aggiornamento $TAG"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" updates
